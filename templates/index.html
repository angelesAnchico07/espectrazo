<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESPECTRAZO</title>
<style>
  :root { --bg:#0b0a1a; --card:#15132b; --line:#2a2650; --txt:#e8e6ff; --mut:#8f8bb8; --acc:#8b5cf6; --acc2:#3b82f6; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(circle at 20% 10%,#1e1450,var(--bg) 55%); color:var(--txt);
         font-family:system-ui,Segoe UI,Roboto,sans-serif; display:flex; flex-direction:column; align-items:center; padding:28px 16px; }
  h1 { margin:0; font-size:2.4rem; letter-spacing:.35em; background:linear-gradient(90deg,#8b5cf6,#38bdf8);
       -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { color:var(--mut); letter-spacing:.3em; font-size:.75rem; margin:6px 0 22px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; width:100%; max-width:980px; }
  .visor { position:relative; background:#000; border-radius:12px; overflow:hidden; aspect-ratio:4/3; max-width:640px; margin:0 auto; }
  .visor img { width:100%; height:100%; object-fit:cover; display:block; }
  .visor .ph { position:absolute; inset:0; display:grid; place-items:center; color:var(--mut); text-align:center; padding:20px; }
  button { border:0; border-radius:999px; padding:12px 24px; font-size:1rem; color:#fff; cursor:pointer;
           background:linear-gradient(90deg,var(--acc),var(--acc2)); }
  button.sec { background:transparent; border:1px solid var(--line); color:var(--txt); }
  button.rec { background:#dc2626; }
  button:disabled { opacity:.5; cursor:default; }
  .center { text-align:center; margin-top:16px; }
  .msg { margin:14px auto 0; text-align:center; color:var(--mut); min-height:1.4em; }
  .msg.err { color:#fca5a5; }
  .grid { display:grid; grid-template-columns:1fr 280px; gap:18px; }
  @media (max-width:820px) { .grid { grid-template-columns:1fr; } }
  .ctl { display:flex; flex-direction:column; gap:14px; }
  label { font-size:.85rem; color:var(--mut); display:flex; justify-content:space-between; }
  input[type=range] { width:100%; accent-color:var(--acc); }
  input[type=color] { width:100%; height:38px; border:1px solid var(--line); background:none; border-radius:8px; }
  select { width:100%; padding:8px; background:var(--bg); color:var(--txt); border:1px solid var(--line); border-radius:8px; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:12px; }
  .chip { background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:.9rem; }
  .chip b { color:#c4b5fd; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; }
  .btns button { flex:1; padding:10px 14px; font-size:.9rem; }
  a { color:#93c5fd; }
  .hide { display:none !important; }
</style>
</head>
<body>
<h1>ESPECTRAZO</h1>
<div class="sub">TU MOVIMIENTO, EN ESTELA</div>

<!-- Pantalla 1: inicio -->
<section id="s1" class="card">
  <div class="visor"><div class="ph">Captura tu movimiento en tiempo real y visualiza la estela de tu silueta.<br>Ubícate frente a la cámara y deja visible el fondo.</div></div>
  <div class="center"><button id="btnStart">Iniciar cámara</button></div>
  <div id="msg1" class="msg"></div>
</section>

<!-- Pantalla 2: resultado -->
<section id="s2" class="card hide">
  <div class="grid">
    <div>
      <div class="visor"><img id="feed" alt="Silueta actual + estela"></div>
      <div class="stats">
        <span class="chip">FPS: <b id="fps">–</b></span>
        <span class="chip">Postura: <b id="postura">–</b></span>
        <span class="chip hide" id="chipRec">● Grabando</span>
      </div>
      <div id="msg2" class="msg">Procesando en tiempo real</div>
    </div>
    <div class="ctl">
      <div><label>Longitud de la estela <span id="vTrail">15</span></label><input id="trail" type="range" min="2" max="60" value="15"></div>
      <div><label>Intensidad <span id="vInt">90%</span></label><input id="int" type="range" min="10" max="100" value="90"></div>
      <div><label>Color</label><input id="color" type="color" value="#8b5cf6"></div>
      <div><label>Fondo</label><select id="fondo"><option value="video">Video tenue</option><option value="negro">Negro</option></select></div>
      <div class="btns"><button class="sec" id="btnCal">Recalibrar fondo</button></div>
      <div class="btns"><button class="rec" id="btnRec">Guardar video</button></div>
      <div id="dl" class="msg hide"></div>
      <div class="btns"><button class="sec" id="btnBack">Volver a inicio</button></div>
    </div>
  </div>
</section>

<script>
const $ = id => document.getElementById(id);
const post = (u, b = {}) => fetch(u, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) });
let poll = null, grabando = false;

function pantalla(n) { $("s1").classList.toggle("hide", n !== 1); $("s2").classList.toggle("hide", n !== 2); }

async function iniciar() {
  $("btnStart").disabled = true; $("msg1").className = "msg"; $("msg1").textContent = "Iniciando cámara…";
  await post("/api/camera", { action: "start" });
  for (let i = 0; i < 20; i++) {                       // espera hasta 5 s a que la cámara responda
    await new Promise(r => setTimeout(r, 250));
    const s = await (await fetch("/api/status")).json();
    if (s.error) { fallo(); return; }
    if (s.running && s.fps > 0) {
      $("feed").src = "/video_feed?" + Date.now(); pantalla(2); poll = setInterval(actualizar, 500); return;
    }
  }
  fallo();
}
function fallo() {
  $("btnStart").disabled = false; $("msg1").className = "msg err";
  $("msg1").textContent = "No se pudo acceder a la cámara. Revisa los permisos o conecta una cámara.";
}
async function detener() {
  clearInterval(poll); await post("/api/camera", { action: "stop" });
  $("feed").removeAttribute("src"); $("btnStart").disabled = false; $("msg1").textContent = ""; pantalla(1);
}
async function actualizar() {
  const s = await (await fetch("/api/status")).json();
  if (s.error) { await detener(); fallo(); return; }
  $("fps").textContent = s.fps || "–";
  $("postura").textContent = !s.modelo ? "sin modelo" : (s.postura ? `${s.postura} (${s.confianza}%)` : "–");
  const m = $("msg2"); m.className = "msg";
  if (s.aprendiendo) m.textContent = "Aprendiendo el fondo… sal del cuadro unos segundos.";
  else if (!s.hay_silueta) m.textContent = "No se detecta una silueta. Ubícate frente a la cámara y revisa la iluminación.";
  else m.textContent = "Procesando en tiempo real";
  if (s.error_rec) { m.className = "msg err"; m.textContent = s.error_rec; }
  grabando = s.grabando; $("chipRec").classList.toggle("hide", !s.grabando);
  $("btnRec").textContent = s.grabando ? "Detener y guardar" : "Guardar video";
  if (!s.grabando && s.video && $("dl").dataset.v !== s.video) {
    $("dl").dataset.v = s.video; $("dl").classList.remove("hide");
    $("dl").innerHTML = `Video listo: <a href="/recordings/${s.video}">descargar</a> (también en la carpeta recordings/)`;
  }
}
const enviar = () => post("/api/params", { trail: +$("trail").value, intensidad: $("int").value / 100, color: $("color").value, fondo: $("fondo").value });
$("trail").oninput = () => { $("vTrail").textContent = $("trail").value; enviar(); };
$("int").oninput = () => { $("vInt").textContent = $("int").value + "%"; enviar(); };
$("color").oninput = enviar; $("fondo").onchange = enviar;
$("btnStart").onclick = iniciar; $("btnBack").onclick = detener;
$("btnCal").onclick = () => post("/api/calibrate");
$("btnRec").onclick = () => { $("dl").classList.add("hide"); post("/api/record", { action: grabando ? "stop" : "start" }); };
</script>
</body>
</html>
